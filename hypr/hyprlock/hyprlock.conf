$WALLPAPER_PATH	= ~/.config/hypr/RedFlouwer.png
$USR_IMG_PATH	= ~/.config/hypr/hyprlock/usr-img.jpg
$CITY		= Barcelona
$COUNTRY	= Spain


general {
    disable_loading_bar = false
    no_fade_in = false
    grace = 0
}

background {
    path = $WALLPAPER_PATH
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 170, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    inner_color = rgba(100, 114, 125, 0.4)
    outer_color = rgba(0, 0, 0, 0)
    font_color = rgb(200, 200, 200)
    font_family = "Hack Nerd Font"
    placeholder_text = <span>Enter password</span>
    hide_input = false
    position = 0, -425
    halign = center
    valign = center
}

#Hora
label{
    monitor =
    #text = cmd[update:1000] echo "<span>$(date + "%H:%M")</span>"
    text = cmd[update:1000] echo $(date +'%H:%M')
    color = rgba(216, 222, 233, 0.70)
    font_size = 85
    font_family = Hack Nerd Font
    position = 0, 310
    halign = center
    valign = center
}

#Fecha
label {
    monitor =
    text = cmd[update:1000] echo $(date +'%A, %B %d')
    color = rgba(216, 222, 233, 0.70)
    font_size = 30
    font_family = "Hack Nerd Font"
    position = 0, 400
    halign = center
    valign = center
}

#Foto
image {
    path = /home/isma/.config/hypr/hyprlock/usr-img.png
    border_color = 0xffdddddd
    border_size = 0
    size = 110
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -265
    halign = center
    valign = center
}


#Usuario
label {
    monitor =
    text = $USER
    color = rgba(216, 222, 233, 0.70)
    font_size = 20
    font_family = "Hack Nerd Font"
    position = 0, -360
    halign = center
    valign = center
}

#CurrentSong (Spoty change to other)
label{
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/music-playing.sh)"
    color = rgba(216, 222, 233, 0.70)
    font_size = 18
    font_family = "Hack Nerd Font"
    position = 100, 0
    halign = left
    valign = center
}

#Tiempo
label{
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/weather.sh)"

    shadow_passes = 1
    shadow_boost = 0.5

    color = rgba(216, 222, 233, 0.70)
    font_size = 18
    font_family = "Hack Nerd Font"
    position = 95.5, -40
    halign = left  
    valign = center
}


